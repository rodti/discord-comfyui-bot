services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      COMFYUI_URL: ${COMFYUI_URL:-}
      BOT_CONFIG: ${BOT_CONFIG:-/app/config.json}
    volumes:
      - ./config.json:/app/config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
